      const pos = `${d.title}::qa::${si}::${pi}`;
      html += `<tr>
        <td class="q-col">${hi(p.question,terms)}</td>
        <td class="b-col">${hi(p.benefit,terms)}${editMode?`<br>${scriptField(pos)}`:''}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  if (d.code_sections.length) {
    html += `<div class="lp-section"><h2>Lead Transfer Codes</h2><div class="lp-codes">`;
    d.code_sections.forEach((sec,si) => {
      sec.codes.forEach((c,ci) => {
        html += `<button class="tc-btn" data-copy="${esc(c.code)}">
          <span class="tc-desc">${hi(c.descriptor,terms)}</span>
          <span class="tc-code">${hi(c.code,terms)}</span>
          <span class="tc-icon">📋</span>
        </button>`;
      });
    });
    html += `</div></div>`;
  }
  return html;
}

function renderMixed(sheet, terms) {
  const d = DATA[sheet];
  let html = `<div class="page-title">${esc(d.title)}</div>`;
  d.sections.forEach((sec,si) => {
    html += `<div class="mixed-section">`;
    if (sec.header) html += `<h2>${esc(sec.header)}</h2>`;
    sec.items.forEach((it,ii) => {
      const pos = `${d.title}::${si}::${ii}`;
      const ph = phoneDetect(it.text);
      html += `<div class="mixed-item">
        <div class="mi-text ${it.bold?'bold':'normal'}">${hi(it.text,terms)}</div>
        <div style="display:flex;gap:5px;flex-shrink:0;align-items:center">
          ${it.url ? linkBtn(it.url,'↗') : ''}
          ${ph && !it.url ? copyBtn(ph.replace(/[-.\s]/g,'')) : ''}
        </div>
      </div>`;
      if (editMode) {
        html += `<div style="padding:0 10px 6px 10px">${scriptField(pos)}</div>`;
      } else {
        const sc = getEdit(pos,'script_blurb');
        if (sc) html += `<div style="padding:0 10px 6px 10px"><div class="script-blurb">${esc(sc)}</div></div>`;
      }
    });
    html += `</div>`;
  });
  return html;
}

function renderGaps() {
  // Group all entries that have no script blurb by sheet
  const bySheet = {};
  for (const e of SEARCH_INDEX) {
    const sc = getEdit(e.pos, 'script_blurb');
    if (sc) continue; // already scripted
    if (!bySheet[e.sheet]) bySheet[e.sheet] = [];
    bySheet[e.sheet].push(e);
  }

  const totalGaps = Object.values(bySheet).reduce((a, b) => a + b.length, 0);
  const {total, scripted} = countScriptable();

  let html = `
    <div class="page-title" style="font-size:16px">📋 Gaps — ${totalGaps} entries need scripts</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:20px">
      ${scripted} of ${total} scripted (${Math.round(scripted/total*100)}% done).
      Turn on <strong>✎ Edit mode</strong> to fill these in.
    </div>`;

  // Sort sheets by gap count descending
  const sheets = Object.entries(bySheet).sort((a,b) => b[1].length - a[1].length);

  sheets.forEach(([sheet, entries]) => {
    html += `
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;
          padding-bottom:7px;border-bottom:1px solid var(--border)">
          <span style="font-size:13px;font-weight:700;color:var(--accent2);font-family:var(--mono)">${esc(sheet)}</span>
          <span style="font-size:11px;color:var(--muted);background:var(--surface2);
            padding:2px 8px;border-radius:999px;border:1px solid var(--border)">${entries.length} missing</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px">`;

    entries.forEach(e => {
      html += `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:9px;
          padding:9px 12px;display:flex;flex-direction:column;gap:4px">
          <div style="font-size:13px;font-weight:600">${esc(e.label.slice(0,60))}</div>
          ${e.section ? `<div style="font-size:11px;color:var(--dim)">${esc(e.section)}</div>` : ''}
          ${editMode ? `<textarea class="editable" data-pos="${esc(e.pos)}" data-field="script_blurb"
            rows="2" placeholder="Add your call script…"></textarea>` : ''}
        </div>`;
    });

    html += `</div></div>`;
  });

  return html;
}

function renderSidekick() {
  const cfData = DATA['Call Flow'];
  const tcData = DATA['Transfer Codes'];
  const spData = DATA['Secure Pause'];
  const tdData = DATA['Transfer Drivers'];

  // Build transfer codes list
  let tcItems = [];
  if (tcData) {
    tcData.sections.forEach(sec => {
      sec.codes.forEach(c => tcItems.push(c));
    });
  }

  // Build secure pause items
  let spItems = [];
  if (spData) {
    spData.sections.forEach((sec, si) => {
      if (si === 0) return; // skip the "when to use" section
      spItems.push({ label: sec.header, items: sec.items });
    });
  }

  // Build transfer drivers
  let tdItems = [];
  if (tdData) {
    tdData.sections.forEach((sec, si) => {
      if (si === 0) return; // skip the rule section
      const firstItem = sec.items[0];
      tdItems.push({ label: sec.header, detail: firstItem ? firstItem.text.slice(0, 80) : '' });
    });
  }

  // Build call flow steps from Call Flow data
  const cfPhases = cfData ? cfData.phases.filter(p => p.phase !== 'Never Use — QA Flags') : [];
  const allAnchors = cfPhases.flatMap((ph, pi) =>
    ph.anchors.map((a, ai) => ({ ...a, phase: ph.phase, pi, ai }))
  );

  return `
  <div class="sk-wrap">

    <!-- LEFT: Search + Results -->
    <div class="sk-panel">
      <div class="sk-panel-head"><span class="sk-dot"></span> QB Expert Search</div>
      <div class="sk-search-wrap">
        <input class="sk-search" id="sk-q" type="search" placeholder="Search 876 entries across all sheets..." autocomplete="off">
      </div>
      <div class="sk-panel-body" id="sk-results">
        <div class="sk-empty">⌨ Type to search the knowledge base<br><br>
          <span style="color:#ff6b2b44;font-size:10px">Banking • Payments • Transfers • Reconciliation<br>Log In • Billing • Payroll • How Tos • VCI • NLH</span>
        </div>
      </div>
    </div>

    <!-- MIDDLE: Call Flow + Transfer Drivers -->
    <div class="sk-panel">
      <div class="sk-panel-head"><span class="sk-dot" style="background:#ff6b2b;box-shadow:0 0 6px #ff6b2b"></span> Call Flow</div>
      <div class="sk-panel-body">
        <div class="sk-flow-grid" id="sk-flow-grid">
          ${allAnchors.map((a, i) => `
            <button class="sk-flow-btn ${i===0?'active':''}" data-sk-flow="${i}">${esc(a.tag.slice(0,14))}</button>
          `).join('')}
        </div>
        <div class="sk-flow-detail" id="sk-flow-detail">
          <div class="sk-flow-title">${esc(allAnchors[0]?.phase||'')}</div>
          <div class="sk-flow-script">${esc(allAnchors[0]?.script_blurb || allAnchors[0]?.text || '')}</div>
          ${allAnchors[0]?.type === 'tip' ? `<div class="sk-flow-watch">⚡ ${esc(allAnchors[0].text)}</div>` : ''}
        </div>

        <div class="sk-section-head orange">⚡ Transfer Drivers</div>
        ${tdItems.map(td => `
          <button class="sk-xfer-btn">
            <strong>${esc(td.label)}</strong>
            <span>${esc(td.detail.slice(0,70))}...</span>
          </button>
        `).join('')}
      </div>
    </div>

    <!-- RIGHT: Secure Pause + Transfer Codes -->
    <div class="sk-panel">
      <div class="sk-panel-head"><span class="sk-dot" style="background:#00ff9d;box-shadow:0 0 6px #00ff9d"></span> Secure Pause</div>
      <div class="sk-panel-body">
        <div class="sk-sec-grid" id="sk-sec-grid">
          ${spItems.map((item, i) => `
            <button class="sk-sec-btn" data-sk-sec="${i}">${esc(item.label.replace(' / ',' /\n'))}</button>
          `).join('')}
        </div>
        <div class="sk-sec-script" id="sk-sec-script">
          <strong>Select a trigger above</strong>
          Click any item to see the script to say.
        </div>

        <div class="sk-section-head">⚡ Quick Transfer Codes</div>
        ${tcItems.slice(0,12).map(c => `
          <button class="sk-tc-btn" data-copy="${esc(c.code)}">
            <span style="color:#6a9bbf;font-size:10px">${esc(c.descriptor)}</span>
            <span class="sk-tc-code">${esc(c.code)} 📋</span>
          </button>
        `).join('')}
      </div>
    </div>

  </div>

  <script>
  // Sidekick search
  const skQ = document.getElementById('sk-q');
  const skResults = document.getElementById('sk-results');
  const skFlowGrid = document.getElementById('sk-flow-grid');
  const skFlowDetail = document.getElementById('sk-flow-detail');
  const skSecGrid = document.getElementById('sk-sec-grid');
  const skSecScript = document.getElementById('sk-sec-script');

  const SK_ANCHORS = ${JSON.stringify(allAnchors)};
  const SK_SP = ${JSON.stringify(spItems)};

  skQ && skQ.addEventListener('input', e => {
    const terms = tok(e.target.value);
    if (!terms.length) {
      skResults.innerHTML = '<div class="sk-empty">⌨ Type to search the knowledge base</div>';
      return;
    }
    const hits = SEARCH_INDEX
      .map(entry => ({ entry, s: scoreEntry(entry, terms) }))
      .filter(x => x.s > 0)
      .sort((a,b) => b.s - a.s)
      .slice(0, 25);

    if (!hits.length) {
      skResults.innerHTML = '<div class="sk-empty">No matches found</div>';
      return;
    }
    skResults.innerHTML = hits.map(({entry}) => {
      const sc = getEdit(entry.pos, 'script_blurb');
      return '<div class="sk-result">' +
        '<div class="sk-r-sheet">' + esc(entry.sheet.trim()) + (entry.section ? ' · ' + esc(entry.section) : '') + '</div>' +
        '<div class="sk-r-label">' + hi(entry.label, terms) + '</div>' +
        (entry.desc ? '<div class="sk-r-desc">' + hi(entry.desc.slice(0,80), terms) + '</div>' : '') +
        (sc ? '<div class="sk-r-desc" style="color:#ff6b2b;font-style:italic">🎤 ' + esc(sc.slice(0,80)) + '</div>' : '') +
        (entry.url ? '<a class="sk-r-link" href="' + esc(entry.url) + '" target="_blank" rel="noopener">Open ↗</a>' : '') +
        '</div>';
    }).join('');
  });

  // Call flow click
  skFlowGrid && skFlowGrid.addEventListener('click', e => {
    const btn = e.target.closest('[data-sk-flow]'); if (!btn) return;
    document.querySelectorAll('.sk-flow-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const anchor = SK_ANCHORS[Number(btn.dataset.skFlow)];
    if (!anchor) return;
    const script = getEdit('callflow::' + anchor.phase + '::' + anchor.ai, 'script_blurb') || anchor.script_blurb || anchor.text || '';
    skFlowDetail.innerHTML =
      '<div class="sk-flow-title">' + esc(anchor.phase) + ' — ' + esc(anchor.tag) + '</div>' +
      '<div class="sk-flow-script">' + esc(script) + '</div>';
  });

  // Secure pause click
  skSecGrid && skSecGrid.addEventListener('click', e => {
    const btn = e.target.closest('[data-sk-sec]'); if (!btn) return;
    document.querySelectorAll('.sk-sec-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const item = SK_SP[Number(btn.dataset.skSec)];
    if (!item) return;
    const trigger = item.items[0]?.text || '';
    const script = item.items[1]?.text || '';
    skSecScript.innerHTML =
      '<strong>' + esc(item.label) + '</strong>' +
      '<div style="color:#6a9bbf;font-size:10px;margin-bottom:6px">' + esc(trigger.replace('Trigger: ','')) + '</div>' +
      esc(script.replace('Script: ','').replace(/^"(.*)"$/, '$1'));
  });
  <\/script>
  `;
}

function renderSearch() {
  const terms = tok(searchQ);
  const hits = SEARCH_INDEX
    .map(e => ({e, s: scoreEntry(e, terms)}))
    .filter(x => x.s > 0)
    .sort((a,b) => b.s - a.s);
  
  fstat.textContent = `${hits.length} results`;
  if (!hits.length) return `<div class="empty">No matches. Try different keywords.</div>`;
  
  let html = `<div class="page-title" style="font-size:16px">
    ${hits.length} results for "${esc(searchQ)}"
  </div><div class="results-list">`;
  
  hits.forEach(({e}) => {
    const sc = getEdit(e.pos,'script_blurb');
    const isCode = e.isCode;
    html += `<div class="result-card">
      <div class="rc-meta">${esc(e.sheet.trim())}${e.section?' · '+esc(e.section):''}</div>
      <div class="rc-label">${hi(e.label,terms)}</div>
      ${e.desc && !isCode ? `<div class="rc-desc">${hi(e.desc,terms)}</div>` : ''}
      ${isCode ? `<div class="rc-footer">${copyBtn(e.codeVal)}</div>` : ''}
      ${sc ? `<div class="script-blurb">${esc(sc)}</div>` : ''}
      <div class="rc-footer">
        ${e.url ? linkBtn(e.url) : ''}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ── main render ── */
function render() {
  const terms = tok(searchQ);
  
  if (!searchQ && activeSheet === '__search__') { activeSheet = 'Call Flow'; renderTabs(); }
  if (searchQ && activeSheet !== '__search__' && activeSheet !== '__sidekick__') { activeSheet = '__search__'; renderTabs(); }
  
  let html = '';
  
  if (activeSheet === '__search__') {
    html = renderSearch();
  } else if (activeSheet === '__gaps__') {
    html = renderGaps();
    fstat.textContent = 'gaps view';
  } else if (activeSheet === '__sidekick__') {
    html = renderSidekick();
    fstat.textContent = '⚡ QB Sidekick Preview';
  } else {
    const d = DATA[activeSheet];
    if (!d) { html = `<div class="empty">Sheet not found</div>`; }
    else {
      const p = d.pattern;
      // Transfer Codes sheet always shows the dedicated panel first
      if (activeSheet === 'Call Flow') {
        html = renderCallFlow();
      } else if (activeSheet === 'Salesforce Workflow') {
        html = renderSalesforceWorkflow();
      } else if (activeSheet === 'Macros / Case Notes') {
        html = renderMacros();
      } else if (activeSheet === 'HotKeys') {
        html = renderHotKeys();
      } else if (activeSheet === 'Secure Pause') {
        html = renderSecurePause();
      } else if (activeSheet === 'Transfer Codes') {
        html = renderTransferSheet(terms);
      } else if (activeSheet === 'HOME') {
        html = renderHome();
      } else if (p === 'multi_column_catalog') {
        html = renderCatalog(activeSheet, terms);
      } else if (p === 'label_desc_link') {
        html = renderCards(activeSheet, terms);
      } else if (p === 'procedure') {
        html = renderProcedure(activeSheet, terms);
      } else if (p === 'lead_pass') {
        html = renderLeadPass(terms);
      } else if (p === 'macros') {
        html = renderMacros();
      } else if (p === 'mixed_text') {
        html = renderMixed(activeSheet, terms);
      }
    }
    // Show TC panel on non-TC, non-search pages when Transfer Codes data available
    // (only if not already TC sheet)
    if (activeSheet !== 'Transfer Codes' && DATA['Transfer Codes'] && !searchQ) {
      // Small quick-access panel at top
    }
    fstat.textContent = d ? `${activeSheet.trim()} — ${d.pattern}` : '';
  }
  
  contentEl.innerHTML = html;
  updateProgress();
}

/* ── events ── */
q.addEventListener('input', e => { searchQ = e.target.value; renderTabs(); render(); });
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { q.value=''; searchQ=''; activeSheet='Call Flow'; renderTabs(); render(); }
  if (e.key === 'Enter') {
    const first = contentEl.querySelector('a.link-btn');
    if (first) first.click();
  }
});

document.addEventListener('keydown', e => {
  if (e.key==='/' && document.activeElement!==q) { e.preventDefault(); q.focus(); q.select(); }
  if (e.key==='Tab' && e.altKey) {
    e.preventDefault();
    const sheets = Object.keys(DATA);
    const idx = sheets.indexOf(activeSheet);
    activeSheet = sheets[(idx+1) % sheets.length];
    searchQ=''; q.value='';
    renderTabs(); render();
  }
});

contentEl.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset.pos) return;
  setEdit(t.dataset.pos, t.dataset.field, t.value);
});

contentEl.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy) { e.preventDefault(); navigator.clipboard.writeText(copy.dataset.copy).then(() => showToast('Copied: '+copy.dataset.copy.slice(0,50))); return; }
  const goto = e.target.closest('[data-goto]');
  if (goto) { activeSheet = goto.dataset.goto; searchQ=''; q.value=''; renderTabs(); render(); }
});

editBtn.addEventListener('click', () => {
  editMode = !editMode;
  editBtn.classList.toggle('on', editMode);
  editBanner.classList.toggle('on', editMode);
  render();
});

exportBtn.addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(edits,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'qb_edits_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
});

importFile.addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  new FileReader().onload = ev => {
    try {
      edits = {...edits, ...JSON.parse(ev.target.result)};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
      render(); showToast('Edits imported');
    } catch(err) { alert('Import failed: '+err.message); }
  }, new FileReader().readAsText(f);
  // fix: proper reader call
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      edits = {...edits, ...JSON.parse(ev.target.result)};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
      render(); showToast('Edits imported ✓');
    } catch(err) { alert('Import failed: '+err.message); }
  };
  reader.readAsText(f);
});

/* ── init ── */
// Check for ?q= URL parameter — allows deep-linking from external tools
const urlParams = new URLSearchParams(window.location.search);
const urlQuery = urlParams.get('q');
if (urlQuery) {
  searchQ = urlQuery;
  q.value = urlQuery;
  activeSheet = '__search__';
}
renderTabs();
render();
</script>
</body>
</html>
